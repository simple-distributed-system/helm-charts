replicaCount: 1

image:
  repository: ghcr.io/sarka99/notes-service
  pullPolicy: IfNotPresent
  tag: "9c566a8-dirty"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  containerPort: 8080
  name: notes-service

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    memory: 256Mi
    cpu: 30m
  limits:
    memory: 512Mi
    cpu: 500m


readinessProbe:
  httpGet:
    path: /manage/health/readiness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5

startupProbe:
  httpGet:
    path: /manage/health/liveness
    port: 8080
  failureThreshold: 30
  initialDelaySeconds: 30
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /manage/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

# Non-secret environment variables injected into the container
env:
  SPRING_PROFILES_ACTIVE: test
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
