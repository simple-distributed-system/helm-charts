apiVersion: skaffold/v4beta11
kind: Config

# ---------------------------------------------------------------------------
# BUILD
# Images are pushed to ghcr.io, then pulled by the real k3s cluster's nodes
# (authenticated via the ghcr-secret imagePullSecret in the notes namespace).
# ---------------------------------------------------------------------------
build:
  local:
    push: true
    useDockerCLI: true
  artifacts:
    - image: api-gateway
      context: ../api-gateway
      docker:
        dockerfile: Dockerfile
    - image: notes-service
      context: ../notes-service
      docker:
        dockerfile: Dockerfile
    - image: notes-web
      context: ../notes-web
      docker:
        dockerfile: Dockerfile

# ---------------------------------------------------------------------------
# DEPLOY
# Skaffold renders each Helm chart and applies it to whatever cluster your
# current kubectl context points at (k3s-lab).
# setValueTemplates injects the Skaffold-managed image tag into the chart,
# overriding the static "local" tag in values.yaml.
# ---------------------------------------------------------------------------
deploy:
  helm:
    releases:
      - name: api-gateway
        namespace: notes
        chartPath: helm-api-gateway
        valuesFiles:
          - helm-api-gateway/values.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_api_gateway}}"
          image.tag: "{{.IMAGE_TAG_api_gateway}}"
        setValues:
          image.pullPolicy: IfNotPresent

      - name: notes-service
        namespace: notes
        chartPath: helm-notes-service
        valuesFiles:
          - helm-notes-service/values.yaml
          - helm-notes-service/secret-values.yaml   # gitignored — contains POSTGRES_URI
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_notes_service}}"
          image.tag: "{{.IMAGE_TAG_notes_service}}"
        setValues:
          image.pullPolicy: IfNotPresent

      - name: notes-web
        namespace: notes
        chartPath: helm-notes-web
        valuesFiles:
          - helm-notes-web/values.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_notes_web}}"
          image.tag: "{{.IMAGE_TAG_notes_web}}"
        setValues:
          image.pullPolicy: IfNotPresent