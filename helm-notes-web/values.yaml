replicaCount: 1

image:
  repository: notes-web
  pullPolicy: Never
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  name: notes-web

# Ingress is enabled — this is the public entry point via nginx-ingress + Cloudflare Tunnel
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: notes.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
