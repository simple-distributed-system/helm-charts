replicaCount: 1

image:
  repository: ghcr.io/sarka99/api-gateway
  pullPolicy: IfNotPresent
  tag: "ded297f-dirty"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# URI of the notes-service ClusterIP service
notesServiceUri: http://notes-service:80

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  containerPort: 8080
  name: api-gateway

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

readinessProbe:
  httpGet:
    path: /manage/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5

startupProbe:
  httpGet:
    path: /manage/health/liveness
    port: 8080
  failureThreshold: 30
  initialDelaySeconds: 30
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /manage/health/liveness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
